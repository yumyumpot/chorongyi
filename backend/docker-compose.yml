version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: chorongyi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: chfhd2
      MYSQL_USER: chorong
      MYSQL_PASSWORD: chorongpw
      MYSQL_DATABASE: chorongyi
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: .
    container_name: chorongyi-backend
    depends_on:
      - db
    environment:
      - DATABASE_URL=mysql+pymysql://chorong:chorongpw@db:3306/chorongyi
      - DB_NAME=chorongyi
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=chorong
      - DB_PASSWORD=chorongpw
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000"

volumes:
  db_data:
